<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referee Control Panel - IRISH</title>
    <link rel="stylesheet" href="/static/css/referee.css">
    <script src="/static/js/socket-shim.js" data-staff></script>

</head>
<body>
    <div class="referee-panel">
        <div class="topbar">
            <div class="topbar-row">
                <span class="top-match">Match <span id="match-num">?</span></span>
                <span class="timer-display" id="match-timer">0:20</span>
                <span class="bonus-indicator" id="bonus-indicator">AUTO</span>
            </div>
            <div class="topbar-row">
                <span class="red-score">0</span>
                <span class="teams" id="current-match">Waiting for match…</span>
                <span class="blue-score">0</span>
            </div>
            <div id="endgame-indicator" class="endgame-indicator"></div>
        </div>

        <nav class="role-tabs" aria-label="What are you scoring?">
            <button data-role="red-hub">Red HUB</button>
            <button data-role="blue-hub">Blue HUB</button>
            <button data-role="ref">Referee</button>
            <button data-role="all">All</button>
        </nav>

        <div class="hub-pair">
            <section data-show="red-hub all">
                <button class="score-btn red-btn fuel-btn" data-hub="red">+1 FUEL
                    <small>RED SIDE of the HUB<br>counts for <b data-hub-label="red">RED · 4pts</b></small>
                </button>
            </section>
            <section data-show="blue-hub all">
                <button class="score-btn blue-btn fuel-btn" data-hub="blue">+1 FUEL
                    <small>BLUE SIDE of the HUB<br>counts for <b data-hub-label="blue">BLUE · 4pts</b></small>
                </button>
            </section>
        </div>

        <section data-show="ref all">
            <div class="ref-grid">
                <div class="ref-col">
                    <div class="section-title" style="color: #ff6b6b">RED ALLIANCE</div>
                    <button class="score-btn red-btn" data-alliance="red" data-type="leave">LEAVE<br><small>+3 · AUTO</small></button>
                    <button class="score-btn red-btn" data-alliance="red" data-type="park">PARK<br><small>+2</small></button>
                    <button class="score-btn penalty-btn" data-alliance="red" data-type="minor_foul">MINOR FOUL<br><small>+2 to Blue</small></button>
                    <button class="score-btn danger-btn" data-alliance="red" data-type="major_foul">MAJOR FOUL<br><small>+6 to Blue</small></button>
                </div>
                <div class="ref-col">
                    <div class="section-title" style="color: #6bb6ff">BLUE ALLIANCE</div>
                    <button class="score-btn blue-btn" data-alliance="blue" data-type="leave">LEAVE<br><small>+3 · AUTO</small></button>
                    <button class="score-btn blue-btn" data-alliance="blue" data-type="park">PARK<br><small>+2</small></button>
                    <button class="score-btn penalty-btn" data-alliance="blue" data-type="minor_foul">MINOR FOUL<br><small>+2 to Red</small></button>
                    <button class="score-btn danger-btn" data-alliance="blue" data-type="major_foul">MAJOR FOUL<br><small>+6 to Red</small></button>
                </div>
            </div>
            <button class="score-btn neutral-btn" data-type="connection">🔗 CONNECTION FORMED<br><small>all 4 robots · RP for both</small></button>
        </section>
    </div>

    <div class="bottom-bar">
        <button id="undo-btn" class="undo-btn" disabled>↶ Undo</button>
        <div class="rp-display" id="rp-display">FUEL · Red 0 | Blue 0</div>
    </div>

    <!-- Review Mode Overlay -->
    <div id="review-mode-overlay" class="review-overlay" style="display: none;">
        <div class="review-panel">
            <div class="review-header">
                <h2>🔍 MATCH UNDER REVIEW</h2>
                <button id="exit-review-btn" class="exit-review-btn">Exit Review Mode</button>
            </div>

            <div class="review-content">
                <div class="review-section">
                    <h3>Current Match Scores</h3>
                    <div class="review-scores-display">
                        <div class="review-alliance-score red">
                            <span class="alliance-name">Red Alliance</span>
                            <span class="score-value" id="review-red-score">0</span>
                        </div>
                        <div class="review-alliance-score blue">
                            <span class="alliance-name">Blue Alliance</span>
                            <span class="score-value" id="review-blue-score">0</span>
                        </div>
                    </div>
                </div>

                <div class="review-section">
                    <h3>Scoring Events Log</h3>
                    <div id="scoring-log" class="scoring-log">
                        <p class="no-events">Loading events...</p>
                    </div>
                </div>

                <div class="review-section">
                    <h3>Add Scoring Event</h3>
                    <div class="add-event-form">
                        <div class="form-row">
                            <label>Alliance:</label>
                            <select id="add-event-alliance">
                                <option value="red">Red Alliance</option>
                                <option value="blue">Blue Alliance</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>Event Type:</label>
                            <select id="add-event-type">
                                <option value="auto_fuel">AUTO FUEL - 4pts</option>
                                <option value="teleop_fuel">TELEOP FUEL - 2pts</option>
                                <option value="leave">LEAVE - 3pts</option>
                                <option value="park">PARK - 2pts</option>
                                <option value="minor_foul">MINOR FOUL - +2 to opponent</option>
                                <option value="major_foul">MAJOR FOUL - +6 to opponent</option>
                                <option value="connection">CONNECTION (both alliances)</option>
                            </select>
                        </div>
                        <button id="add-event-btn" class="add-event-btn">Add Event</button>
                    </div>
                </div>

                <div class="review-actions">
                    <button id="apply-review-btn" class="apply-btn">Save & Exit Review</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentMatchId = null;
        let myEvents = [];  // ids of events this phone created, for Undo

        // Role picker: each phone only shows what it scores (remembered per device)
        function setRole(role) {
            document.body.dataset.role = role;
            document.querySelectorAll('.role-tabs button').forEach(b => b.classList.toggle('active', b.dataset.role === role));
            document.querySelectorAll('[data-show]').forEach(el => { el.hidden = !el.dataset.show.split(' ').includes(role); });
            try { localStorage.setItem('irish-ref-role', role); } catch (e) {}
        }
        document.querySelectorAll('.role-tabs button').forEach(b => b.addEventListener('click', () => setRole(b.dataset.role)));
        let savedRole = null;
        try { savedRole = localStorage.getItem('irish-ref-role'); } catch (e) {}
        setRole(savedRole || 'all');

        function updateUndo() { document.getElementById('undo-btn').disabled = myEvents.length === 0; }
        document.getElementById('undo-btn').addEventListener('click', () => {
            const id = myEvents.pop();
            updateUndo();
            if (id && currentMatchId) socket.emit('delete_event', { event_id: id, match_id: currentMatchId });
        });
        socket.on('event_recorded', (data) => { myEvents.push(data.event_id); updateUndo(); });

        function formatClock(t) {
            return `${Math.floor(t / 60)}:${(t % 60).toString().padStart(2, '0')}`;
        }

        function updateScores(m) {
            document.querySelector('.red-score').textContent = m.red_score;
            document.querySelector('.blue-score').textContent = m.blue_score;
            document.getElementById('rp-display').textContent =
                `FUEL · Red ${m.red_auto_fuel + m.red_teleop_fuel} | Blue ${m.blue_auto_fuel + m.blue_teleop_fuel}` +
                (m.connection ? ' | CONNECTION ✓' : '');
        }

        function updateTimer(data) {
            document.getElementById('match-timer').textContent = formatClock(data.time_remaining);
            document.getElementById('endgame-indicator').textContent = data.is_endgame ? 'END GAME - 30 SECONDS!' : '';
            document.getElementById('bonus-indicator').textContent = data.period;

            // Show which alliance each HUB side is crediting right now
            const auto = data.period === 'AUTO';
            const owners = { red: data.red_side_alliance, blue: data.red_side_alliance === 'red' ? 'blue' : 'red' };
            document.querySelectorAll('[data-hub-label]').forEach(el => {
                el.textContent = `${owners[el.dataset.hubLabel].toUpperCase()} · ${auto ? 4 : 2}pts`;
            });
        }

        // Live scoring buttons: server works out points (and for FUEL, which alliance + period)
        document.querySelectorAll('.score-btn[data-hub], .score-btn[data-type]').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!currentMatchId) return;
                if (navigator.vibrate) navigator.vibrate(25);  // tap feedback
                socket.emit('score_event', btn.dataset.hub
                    ? { match_id: currentMatchId, event_type: 'fuel', hub_side: btn.dataset.hub }
                    : { match_id: currentMatchId, event_type: btn.dataset.type, alliance: btn.dataset.alliance });
            });
        });

        // Socket event listeners
        socket.on('score_updated', (data) => {
            updateScores(data);
            if (reviewMode) loadMatchEvents();
        });

        socket.on('timer_update', updateTimer);

        socket.on('match_started', (data) => {
            currentMatchId = data.match_id;
            myEvents = [];
            updateUndo();
            document.getElementById('match-num').textContent = data.match_number;
            document.getElementById('current-match').textContent =
                `${data.red_team1} ${data.red_team2} vs ${data.blue_team1} ${data.blue_team2}`;
            updateScores(data);
        });

        socket.on('match_ended', (data) => {
            // Don't reload - keep currentMatchId available for review mode
            console.log('Match ended. Match ID:', currentMatchId);
        });

        // Review Mode Functionality
        let reviewMode = false;

        socket.on('show_review', (data) => {
            // Set the match ID from review mode trigger
            if (data && data.match_id) {
                currentMatchId = data.match_id;
                console.log('Review mode activated for match ID:', currentMatchId);
            }
            enterReviewMode();
        });

        socket.on('hide_review', () => {
            exitReviewMode();
        });

        function enterReviewMode() {
            reviewMode = true;
            document.getElementById('review-mode-overlay').style.display = 'flex';
            loadMatchEvents();
        }

        function exitReviewMode() {
            reviewMode = false;
            document.getElementById('review-mode-overlay').style.display = 'none';
        }

        function loadMatchEvents() {
            if (!currentMatchId) {
                document.getElementById('scoring-log').innerHTML = '<p class="no-events">No match selected</p>';
                return;
            }

            fetch(`/api/match_events/${currentMatchId}`)
                .then(response => response.json())
                .then(events => {
                    displayScoringLog(events);
                    // Also update current match scores
                    return fetch('/api/matches').then(r => r.json());
                })
                .then(matches => {
                    const match = matches.find(m => m.id === currentMatchId);
                    if (match) {
                        document.getElementById('review-red-score').textContent = match.red_score;
                        document.getElementById('review-blue-score').textContent = match.blue_score;
                    }
                })
                .catch(err => {
                    console.error('Failed to load match events:', err);
                    document.getElementById('scoring-log').innerHTML = '<p class="error">Failed to load scoring log</p>';
                });
        }

        const EVENT_NAMES = {
            auto_fuel: 'AUTO FUEL',
            teleop_fuel: 'TELEOP FUEL',
            leave: 'LEAVE',
            park: 'PARK',
            minor_foul: 'MINOR FOUL',
            major_foul: 'MAJOR FOUL',
            connection: 'CONNECTION'
        };

        function displayScoringLog(events) {
            const logContainer = document.getElementById('scoring-log');
            if (!events || events.length === 0) {
                logContainer.innerHTML = '<p class="no-events">No scoring events yet</p>';
                return;
            }

            logContainer.innerHTML = events.map(event => {
                const time = new Date(event.timestamp).toLocaleTimeString();
                const allianceColor = event.alliance === 'red' ? '#ff3333' : event.alliance === 'blue' ? '#3333ff' : '#aaa';
                const detail = event.details ? ` (${event.details})` : '';
                return `
                    <div class="log-entry" data-event-id="${event.id}">
                        <span class="log-time">${time}</span>
                        <span class="log-alliance" style="color: ${allianceColor}">${event.alliance?.toUpperCase() || 'BOTH'}</span>
                        <span class="log-type">${EVENT_NAMES[event.event_type] || event.event_type}${detail}</span>
                        <span class="log-points">+${event.points}pts</span>
                        <button class="delete-event-btn" data-event-id="${event.id}">❌</button>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.delete-event-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (!confirm('Delete this scoring event?')) return;
                    socket.emit('delete_event', { event_id: Number(btn.dataset.eventId), match_id: currentMatchId });
                });
            });
        }

        // Add event button (review mode): explicit alliance + type, server sets points
        document.getElementById('add-event-btn').addEventListener('click', () => {
            if (!currentMatchId) return;
            socket.emit('score_event', {
                match_id: currentMatchId,
                alliance: document.getElementById('add-event-alliance').value,
                event_type: document.getElementById('add-event-type').value
            });
        });

        // Exit review button
        document.getElementById('exit-review-btn').addEventListener('click', () => {
            exitReviewMode();
            socket.emit('fta_hide_review');
        });

        // Apply review changes button - just exit review mode
        document.getElementById('apply-review-btn').addEventListener('click', () => {
            exitReviewMode();
            socket.emit('fta_hide_review');
            // Notify that review is complete and showcase can be enabled
            socket.emit('review_complete', { match_id: currentMatchId });
        });

        // Listen for event deletions
        socket.on('event_deleted', (data) => {
            if (reviewMode) loadMatchEvents();
            updateScores(data);
        });
    </script>
</body>
</html>
